# Rebuilds the 3D chart so it matches real contribution activity.
name: Update activity chart

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -F login="$GITHUB_REPOSITORY_OWNER" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    weeks { contributionDays { date contributionCount } }
                  }
                }
              }
            }' > tools/contributions.json

      - name: Build chart
        run: python3 tools/build_activity.py

      - name: Commit if the chart changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dark.svg assets/activity-light.svg
          git diff --cached --quiet || { git commit -m "Update activity chart" && git push; }
